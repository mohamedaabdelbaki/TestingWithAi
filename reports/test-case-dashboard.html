<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Case Report</title>
<style>
:root{color-scheme:light;--ink:#20203a;--muted:#5e637a;--line:#e7e8f4;--purple:#5838bc;--pass:#13775d;--fail:#b53256;--blocked:#86531a;--skipped:#53617b}
*{box-sizing:border-box} body{margin:0;background:#f7f7fc;color:var(--ink);font:15px/1.5 system-ui,sans-serif} main,.shell{max-width:1320px;margin:auto;padding:0 28px} header{background:white;border-bottom:1px solid var(--line)}.shell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:17px}.brand{font-weight:800;display:flex;align-items:center;gap:10px}.mark{background:#6041ce;color:white;border-radius:10px;padding:4px 10px;font-size:19px}.source,.muted,small{color:var(--muted)}
.hero{margin:28px 0 18px;padding:27px 30px;border-radius:22px;background:radial-gradient(ellipse at 94% 0,#dce9ff,transparent 62%),linear-gradient(110deg,#ede5ff,#f6f0ff);border:1px solid #e6def9}.hero p{margin:4px 0 0;color:#504967}h1,h2,p{margin:0}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.05em;line-height:1.15}h2{font-size:19px;letter-spacing:-.025em}
.panel,.stat{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 16px #24205407}.panel{padding:18px;margin-bottom:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 12px}.search{grid-column:span 2}label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)} input,select,button{font:inherit}input,select{min-width:0;width:100%;height:38px;background:#fafafe;border:1px solid #dddff0;color:var(--ink);border-radius:9px;padding:0 9px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.btn{background:#f1ecff;color:#4b2da9;border:1px solid #e4dafc;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px}.btn:hover{background:#e7ddff}.btn:disabled{opacity:.45;cursor:default}

.charts{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}.track{height:14px;display:flex;overflow:hidden;border-radius:12px;background:#eeedf8;margin:15px 0}.segment{background:var(--tone);height:100%}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend button,.module{display:flex;align-items:center;gap:7px;border:0;background:#f7f7fc;color:var(--ink);text-align:left;border-radius:8px;padding:5px 8px}.legend button:hover,.module:hover{background:#efeafd}.legend button:disabled,.module:disabled{cursor:default}.legend strong{margin-left:auto}.dot{width:9px;height:9px;border-radius:50%;background:var(--tone)}.modules{display:grid;gap:5px}.module{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 26px;font-size:12px}.mini{height:7px;border-radius:9px;background:#ebe8f8;overflow:hidden}.mini i{height:100%;display:block;background:linear-gradient(90deg,#7656df,#a387ed);border-radius:9px}.module strong{text-align:right}

dialog{border:1px solid var(--line);border-radius:18px;width:min(620px,calc(100% - 28px));max-height:85vh;padding:20px;color:var(--ink);box-shadow:0 18px 70px #20124740}dialog::backdrop{background:#25223d70}dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0 0}dl div{background:#f7f6fc;border-radius:9px;padding:8px 10px}.wide{grid-column:1/-1}dt{font-size:12px;color:var(--muted);font-weight:700}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:850px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:590px){main,.shell{padding-inline:13px}.hero{padding:20px;margin-top:16px}.filters,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr;gap:0}.panel{padding:13px}.source{font-size:12px}.module{grid-template-columns:minmax(100px,1fr) 1.4fr 23px}}
</style>
</head>

es", "Status": "Blocked", "Severity": "", "Defect ID": "", "Executed By": "Layla Khalil", "Execution Date": "2026-08-26", "Duration (s)": 0, "Environment": "Chrome 141", "Sprint": "Sprint 41", "Comment": "Assistant provider key unavailable in the test environment"}, {"Test ID": "TC-099", "Module": "AI Assistant", "Title": "Chat transcript is announced as a live region", "Type": "Accessibility", "Priority": "Medium", "Automated": "No", "Status": "Blocked", "Severity": "", "Defect ID": "", "Executed By": "Layla Khalil", "Execution Date": "2026-08-26", "Duration (s)": 0, "Environment": "Safari 19", "Sprint": "Sprint 41", "Comment": "Assistant provider key unavailable in the test environment"}, {"Test ID": "TC-100", "Module": "AI Assistant", "Title": "Assistant answers reflect the current pricing rules", "Type": "Functional", "Priority": "High", "Automated": "Yes", "Status": "Failed", "Severity": "Major", "Defect ID": "DEF-5148", "Executed By": "Automation Runner", "Execution Date": "2026-08-27", "Duration (s)": 17, "Environment": "Chrome 141", "Sprint": "Sprint 41", "Comment": "Actual differs from expected — see defect"}]}</script>
<script>
'use strict';
const byId = id => document.getElementById(id);
const {headers, cases} = JSON.parse(byId('data').textContent);
const statuses = ['Passed', 'Failed', 'Blocked', 'Skipped'];
const columns = ['Status', 'Module', 'Priority', 'Automated', 'Type', 'Environment', 'Sprint', 'Severity'];
const pageSize = 12;
let page = 0;
const make = (tag, text, className) => {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  if (className) item.className = className;
  return item;
};
const unique = key => [...new Set(cases.map(row => row[key]))].sort();
const filters = new Map();
for (const key of columns) {
  const label = make('label', key);
  const select = make('select');
  select.append(new Option('All', ''));
  const values = key === 'Priority' ? ['Critical','High','Medium','Low'] : key === 'Status' ? statuses : unique(key);
  for (const value of values) select.append(new Option(value || 'None recorded', value || '__blank__'));
  select.addEventListener('change', refresh);
  label.append(select);
  byId('filters').append(label);
  filters.set(key, select);
}
const spanDates = unique('Execution Date').filter(Boolean);
const sprint = unique('Sprint').filter(Boolean).join(', ');
byId('scope').textContent = [sprint, spanDates.length ? spanDates[0] + ' to ' + spanDates.at(-1) : '', cases.length + ' total cases'].filter(Boolean).join(' · ');
function refresh() {
  page = 0;
  render();
}
function matchedCases() {
  const query = byId('query').value.trim().toLowerCase();
  return cases.filter(row =>
    [...filters].every(([key, select]) => !select.value || (row[key] || '__blank__') === select.value) &&
    (!query || Object.values(row).some(value => String(value).toLowerCase().includes(query)))
  );
}
function toggleFilter(key, value) {
  const select = filters.get(key);
  select.value = select.value === value ? '' : value;
  refresh();
}
function showDetails(row) {
  byId('detail-title').textContent = row['Test ID'] + ' · ' + row.Title;
  byId('fields').replaceChildren(...headers.map(key => {
    const group = make('div', undefined, ['Title','Comment'].includes(key) ? 'wide' : '');
    group.append(make('dt', key), make('dd', row[key] === '' ? '—' : row[key]));
    return group;
  }));
  byId('detail').showModal();
}
function render() {
  const matched = matchedCases();
  const total = matched.length;
  const statusCounts = Object.fromEntries(statuses.map(status => [status, matched.filter(row => row.Status === status).length]));
  const passRate = total ? new Intl.NumberFormat('en', {style:'percent', maximumFractionDigits:1}).format(statusCounts.Passed / total) : '—';
  byId('stats').replaceChildren(...[['Matching cases', total], ...Object.entries(statusCounts), ['Pass rate', passRate]].map(([title, value]) => {
    const tile = make('div', undefined, 'stat ' + (statuses.includes(title) ? title : ''));
    tile.append(make('span', title), make('strong', value));
    return tile;
  }));
  byId('track').replaceChildren(...statuses.map(status => {
    const piece = make('div', undefined, 'segment ' + status);
    piece.style.width = (total ? 100 * statusCounts[status] / total : 0) + '%';
    return piece;
  }));
  byId('legend').replaceChildren(...statuses.map(status => {
    const button = make('button', undefined, status);
    button.append(make('span', undefined, 'dot'), make('span', status), make('strong', statusCounts[status]));
    button.setAttribute('aria-pressed', filters.get('Status').value === status);
    button.onclick = () => toggleFilter('Status', status);
    return button;
  }));
  const modules = unique('Module').map(name => [name, matched.filter(row => row.Module === name).length]);
  modules.sort((left, right) => right[1] - left[1]);
  const maximum = Math.max(1, ...modules.map(([, count]) => count));
  byId('modules').replaceChildren(...modules.map(([name, count]) => {
    const button = make('button', undefined, 'module');
    const track = make('span', undefined, 'mini');
    const bar = make('i');
    bar.style.width = 100 * count / maximum + '%';
    track.append(bar);
    button.append(make('span', name), track, make('strong', count));
    button.setAttribute('aria-pressed', filters.get('Module').value === name);
    button.onclick = () => toggleFilter('Module', name);
    return button;
  }));
  const start = page * pageSize;
  const visible = matched.slice(start, start + pageSize);
  const rows = visible.map(row => {
    const tr = make('tr');
    const cell = make('td');
    const button = make('button', row['Test ID'], 'case');
    button.setAttribute('aria-label', 'View ' + row['Test ID'] + ' details');
    button.onclick = () => showDetails(row);
    cell.append(button);
    tr.append(cell);
    for (const key of ['Title','Module','Priority','Status','Automated','Environment']) {
      const column = make('td');
      column.append(key === 'Status' ? make('span', row[key], 'badge ' + row[key]) : document.createTextNode(row[key] || '—'));
      tr.append(column);
    }
    return tr;
  });
  if (!rows.length) {
    const row = make('tr');
    const cell = make('td', 'No test cases match these filters.', 'empty');
    cell.colSpan = 7;
    row.append(cell);
    rows.push(row);
  }
  byId('rows').replaceChildren(...rows);
  byId('count').textContent = total + ' of ' + cases.length + ' cases';
  byId('page').textContent = total ? (start + 1) + '–' + (start + visible.length) + ' of ' + total : '0 cases';
  byId('prev').disabled = page === 0;
  byId('next').disabled = start + pageSize >= total;
}
byId('query').addEventListener('input', refresh);
byId('reset').onclick = () => {
  byId('query').value = '';
  for (const select of filters.values()) select.value = '';
  refresh();
};
byId('prev').onclick = () => { page -= 1; render(); };
byId('next').onclick = () => { page += 1; render(); };
render();
</script>
